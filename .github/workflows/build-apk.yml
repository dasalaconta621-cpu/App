          cat << 'EOF' > app/src/main/java/com/arrowbot/mobile/service/ArrowAccessibilityService.kt
          package com.arrowbot.mobile.service

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.graphics.Path
          import android.view.accessibility.AccessibilityEvent

          class ArrowAccessibilityService : AccessibilityService() {
              companion object {
                  private var instance: ArrowAccessibilityService? = null
                  fun isServiceRunning(): Boolean = instance != null

                  fun performTap(x: Float, y: Float, onComplete: (() -> Unit)? = null) {
                      instance?.let { service ->
                          val path = Path().apply { moveTo(x, y) }
                          val stroke = GestureDescription.StrokeDescription(path, 0, 50)
                          val gesture = GestureDescription.Builder().addStroke(stroke).build()
                          service.dispatchGesture(gesture, object : GestureResultCallback() {
                              override fun onCompleted(gestureDescription: GestureDescription?) {
                                  onComplete?.invoke()
                              }
                          }, null)
                      }
                  }

                  fun performSwipe(startX: Float, startY: Float, endX: Float, endY: Float, durationMs: Long = 300, onComplete: (() -> Unit)? = null) {
                      instance?.let { service ->
                          val path = Path().apply {
                              moveTo(startX, startY)
                              lineTo(endX, endY)
                          }
                          val stroke = GestureDescription.StrokeDescription(path, 0, durationMs)
                          val gesture = GestureDescription.Builder().addStroke(stroke).build()
                          service.dispatchGesture(gesture, object : GestureResultCallback() {
                              override fun onCompleted(gestureDescription: GestureDescription?) {
                                  onComplete?.invoke()
                              }
                          }, null)
                      }
                  }
              }

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  instance = this
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() { instance = null }
              override fun onDestroy() {
                  super.onDestroy()
                  instance = null
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/arrowbot/mobile/service/ArrowFloatingService.kt
          package com.arrowbot.mobile.service

          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.graphics.PixelFormat
          import android.os.Build
          import android.os.IBinder
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.Toast
          import kotlinx.coroutines.*

          class ArrowFloatingService : Service() {
              private var windowManager: WindowManager? = null
              private var floatingView: View? = null
              private var isRunning = false
              private val serviceScope = CoroutineScope(Dispatchers.Main + Job())

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  windowManager = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  createFloatingWidget()
              }

              private fun createFloatingWidget() {
                  val button = Button(this).apply {
                      text = "â–¶ START BOT"
                      setBackgroundColor(0xFF0284c7.toInt())
                      setTextColor(0xFFFFFFFF.toInt())
                      textSize = 12f
                      setPadding(24, 16, 24, 16)
                  }

                  val layoutType = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  } else {
                      WindowManager.LayoutParams.TYPE_PHONE
                  }

                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      layoutType,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = 50
                      y = 200
                  }

                  button.setOnClickListener {
                      if (!isRunning) {
                          isRunning = true
                          button.text = "â¹ STOP BOT"
                          button.setBackgroundColor(0xFFdc2626.toInt())
                          startBotLoop()
                      } else {
                          isRunning = false
                          button.text = "â–¶ START BOT"
                          button.setBackgroundColor(0xFF0284c7.toInt())
                          Toast.makeText(this, "Bot pausado", Toast.LENGTH_SHORT).show()
                      }
                  }

                  button.setOnTouchListener(object : View.OnTouchListener {
                      private var initialX = 0
                      private var initialY = 0
                      private var initialTouchX = 0f
                      private var initialTouchY = 0f

                      override fun onTouch(v: View?, event: MotionEvent): Boolean {
                          when (event.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  initialX = params.x
                                  initialY = params.y
                                  initialTouchX = event.rawX
                                  initialTouchY = event.rawY
                                  return false
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  val diffX = (event.rawX - initialTouchX).toInt()
                                  val diffY = (event.rawY - initialTouchY).toInt()
                                  if (Math.abs(diffX) > 10 || Math.abs(diffY) > 10) {
                                      params.x = initialX + diffX
                                      params.y = initialY + diffY
                                      windowManager?.updateViewLayout(button, params)
                                      return true
                                  }
                              }
                          }
                          return false
                      }
                  })

                  floatingView = button
                  windowManager?.addView(button, params)
              }

              private fun startBotLoop() {
                  serviceScope.launch {
                      Toast.makeText(this@ArrowFloatingService, "ArrowBot Iniciado! Tocando nas setas...", Toast.LENGTH_SHORT).show()
                      val displayMetrics = resources.displayMetrics
                      val screenWidth = displayMetrics.widthPixels.toFloat()
                      val screenHeight = displayMetrics.heightPixels.toFloat()

                      var step = 0
                      while (isRunning) {
                          delay(350)
                          if (!isRunning) break

                          // Varredura de toques em grade no centro do jogo
                          val cols = 4
                          val rows = 4
                          val startX = screenWidth * 0.2f
                          val endX = screenWidth * 0.8f
                          val startY = screenHeight * 0.3f
                      
