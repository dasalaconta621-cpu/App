name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Gerar Projeto Android
        run: |
          mkdir -p app/src/main/java/com/arrowbot/mobile/service
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          mkdir -p gradle/wrapper

          cat << 'EOF' > settings.gradle
          rootProject.name = "ArrowBotMobile"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'
          apply plugin: 'kotlin-android'

          android {
              namespace 'com.arrowbot.mobile'
              compileSdkVersion 34

              defaultConfig {
                  applicationId "com.arrowbot.mobile"
                  minSdkVersion 26
                  targetSdkVersion 34
                  versionCode 1
                  versionName "1.0.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="ArrowBot Mobile"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".service.ArrowAccessibilityService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:description="@string/accessibility_service_description"
              android:notificationTimeout="100" />
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">ArrowBot Mobile</string>
              <string name="accessibility_service_description">Serviço de automação para o jogo Arrow Maze.</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:padding="24dp"
              android:background="#0f172a">
              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="ArrowBot Mobile"
                  android:textSize="24sp"
                  android:textStyle="bold"
                  android:textColor="#38bdf8" />
              <TextView
                  android:id="@+id/tvStatus"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="8dp"
                  android:text="Bot Pronto para o Jogo"
                  android:textSize="14sp"
                  android:textColor="#94a3b8" />
              <Button
                  android:id="@+id/btnStartBot"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="32dp"
                  android:text="INICIAR SERVIÇO"
                  android:backgroundTint="#0284c7"
                  android:textColor="#ffffff" />
          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/java/com/arrowbot/mobile/MainActivity.kt
          package com.arrowbot.mobile

          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import com.arrowbot.mobile.service.ArrowAccessibilityService

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  val btnStart = findViewById<Button>(R.id.btnStartBot)
                  val tvStatus = findViewById<TextView>(R.id.tvStatus)

                  btnStart.setOnClickListener {
                      if (!ArrowAccessibilityService.isServiceRunning()) {
                          Toast.makeText(this, "Ative a Acessibilidade para o ArrowBot", Toast.LENGTH_LONG).show()
                          startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      } else {
                          tvStatus.text = "Status: Ativo! Pode abrir o jogo."
                          Toast.makeText(this, "ArrowBot Ativo!", Toast.LENGTH_SHORT).show()
                      }
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/arrowbot/mobile/service/ArrowAccessibilityService.kt
          package com.arrowbot.mobile.service

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.graphics.Path
          import android.view.accessibility.AccessibilityEvent

          class ArrowAccessibilityService : AccessibilityService() {
              companion object {
                  private var instance: ArrowAccessibilityService? = null
                  fun isServiceRunning(): Boolean = instance != null

                  fun performTap(x: Float, y: Float, onComplete: (() -> Unit)? = null) {
                      instance?.let { service ->
                          val path = Path().apply { moveTo(x, y) }
                          val stroke = GestureDescription.StrokeDescription(path, 0, 50)
                          val gesture = GestureDescription.Builder().addStroke(stroke).build()
                          service.dispatchGesture(gesture, object : GestureResultCallback() {
                              override fun onCompleted(gestureDescription: GestureDescription?) {
                                  onComplete?.invoke()
                              }
                          }, null)
                      }
                  }
              }

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  instance = this
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() { instance = null }
              override fun onDestroy() {
                  super.onDestroy()
                  instance = null
              }
          }
          EOF

      - name: Baixar Gradle e Compilar APK
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip -q gradle-8.4-bin.zip
          ./gradle-8.4/bin/gradle assembleDebug --no-daemon --stacktrace

      - name: Salvar APK para Baixar no Celular
        uses: actions/upload-artifact@v4
        with:
          name: ArrowBot-APK
          path: app/build/outputs/apk/debug/app-debug.apk
