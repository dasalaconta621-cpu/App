          cat << 'EOF' > app/src/main/java/com/arrowbot/mobile/MainActivity.kt
          package com.arrowbot.mobile

          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import com.arrowbot.mobile.service.ArrowAccessibilityService
          import com.arrowbot.mobile.service.ArrowFloatingService

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  val btnOverlay = findViewById<Button>(R.id.btnOverlay)
                  val btnAccessibility = findViewById<Button>(R.id.btnAccessibility)
                  val btnStart = findViewById<Button>(R.id.btnStartBot)
                  val tvStatus = findViewById<TextView>(R.id.tvStatus)

                  btnOverlay.setOnClickListener {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
                          val intent = Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName"))
                          startActivity(intent)
                      } else {
                          Toast.makeText(this, "Janela Flutuante jÃ¡ permitida!", Toast.LENGTH_SHORT).show()
                      }
                  }

                  btnAccessibility.setOnClickListener {
                      if (!ArrowAccessibilityService.isServiceRunning()) {
                          startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      } else {
                          Toast.makeText(this, "Acessibilidade jÃ¡ estÃ¡ ativa!", Toast.LENGTH_SHORT).show()
                      }
                  }

                  btnStart.setOnClickListener {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
                          Toast.makeText(this, "Por favor, autorize a janela flutuante primeiro", Toast.LENGTH_LONG).show()
                          return@setOnClickListener
                      }
                      if (!ArrowAccessibilityService.isServiceRunning()) {
                          Toast.makeText(this, "Por favor, ative a Acessibilidade primeiro", Toast.LENGTH_LONG).show()
                          return@setOnClickListener
                      }

                      val serviceIntent = Intent(this, ArrowFloatingService::class.java)
                      startService(serviceIntent)
                      Toast.makeText(this, "Bot Flutuante Ativo! Abra o jogo.", Toast.LENGTH_LONG).show()
                      finish()
                  }
              }
          }
